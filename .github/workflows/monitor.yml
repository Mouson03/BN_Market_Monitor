name: price-monitor

on:
  schedule:
    # UTC 22:00-23:00, 00:00-15:00 = 北京时间 06:00-23:00，每小时触发一场
    - cron: "0 22-23,0-15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state.json"
      - "README.md"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 定时触发：循环 70 分钟、每分钟检测一次（10 分钟拖尾吸收触发延迟）
      - name: Run monitor loop (scheduled)
        if: github.event_name == 'schedule'
        run: python monitor.py --loop-minutes 70

      # 手动触发 / 代码推送：只检测一轮，方便快速验证
      - name: Run single check (manual / push)
        if: github.event_name != 'schedule'
        run: python monitor.py --once
